<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#2c5f2d">
    <meta name="description" content="Choose between the Frog Rock Classic and Green Tree Open">
    <title>Open Championships</title>
    <link rel="icon" type="image/png" href="public/images/fgc.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="landing-page">
    <main class="landing-main">
        <section class="landing-intro">
            <div class="landing-logos" aria-label="Tournament logos">
                <img src="public/images/fgc.png" alt="Frog Rock Classic logo" class="landing-logo">
                <img src="public/images/GTO%20logo.png" alt="Green Tree Open logo" class="landing-logo">
            </div>
            <p class="landing-kicker">The bi-annual golf tournament series</p>
            <h1>Choose your Open</h1>
            <p class="landing-copy">Select a tournament to enter its full site.</p>
        </section>

        <section class="open-choices" aria-label="Tournament websites">
            <a class="open-bubble open-bubble--frog" href="frog-rock-open.html">
                <span class="bubble-number">01</span>
                <span class="bubble-title">Frog Rock Classic</span>
                <span class="bubble-action">Enter site <span aria-hidden="true">&#8594;</span></span>
            </a>
            <a class="open-bubble open-bubble--tree" href="green-tree-open.html">
                <span class="bubble-number">02</span>
                <span class="bubble-title">Green Tree Open</span>
                <span class="bubble-action">Enter site <span aria-hidden="true">&#8594;</span></span>
            </a>
        </section>
    </main>
</body>
</html>
